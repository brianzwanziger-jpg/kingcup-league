const KEY='kingcup-v1';const defaultEvents=['Fantasy Football','Bowl Pick’em','March Madness','Champion of Champions','KingCup','GameDay Challenge'];const fresh=()=>({season:'2026',members:[],events:defaultEvents.map((name,i)=>({id:'e'+i,name,status:'Upcoming',weight:1,results:{}})),points:[10,8,6,5,4,3,2,1],updated:null});let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{data=fresh()}const MEMBER_RENAMES={'JM':'Satch','KJ':'The Caucasians','Matt':'Turndog Troubadours','Nicholas':'Powerhouse Honkey','JC':'Redbirds','BZ':'Ziggies','Joe':'In a Pickle Bickell','BEASt':'BEASts','Chris':"Show Me Your TD's",'B-Rad':'B-Rad ballerz'};function normalizeEvents(d){if(!Array.isArray(d?.events))return d;if(Array.isArray(d.members)){d.members.forEach(m=>{const old=m.name,next=MEMBER_RENAMES[old];if(!next)return;m.name=next;d.events.forEach(e=>{if(e.gameday?.historicalTotals&&Object.prototype.hasOwnProperty.call(e.gameday.historicalTotals,old)){e.gameday.historicalTotals[next]=e.gameday.historicalTotals[old];delete e.gameday.historicalTotals[old]}})})}const order={e0:0,e5:1,e1:2,e2:3,e3:4,e4:5};d.events.forEach(e=>{if(e.id==='e5'||e.name==='Big 12')e.name='GameDay Challenge'});d.points=[22,18,15,12,10,8,6,4,2,1];d.events=d.events.map((e,i)=>({e,i})).sort((a,b)=>(order[a.e.id]??99)-(order[b.e.id]??99)||a.i-b.i).map(x=>x.e);return d;}data=normalizeEvents(data);let tab='home',chosen=null,editing=false;const cloud=!!(window.KINGCUP_CONFIG?.url&&window.KINGCUP_CONFIG?.anonKey);let session=null;let cloudReady=false;const cfg=window.KINGCUP_CONFIG||{};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function save(){data.updated=new Date().toISOString();if(cloud){if(!session){toast('Commissioner sign-in required');return}try{const r=await api('/rest/v1/league_state?id=eq.1',{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify({stat }
function gameEditor(e,index){const games=e.gameday?.games||[];const g=index<0?{week:games.length?Math.max(...games.map(x=>Number(x.week)||0))+1:1,home:'',away:'',winner:'',picks:{}}:games[index];const options=(v)=>`<option value="">No selection</option>${[g.away,g.home].filter(Boolean).map(t=>`<option value="${esc(t)}" ${v===t?'selected':''}>${esc(t)}</option>`).join('')}`;
 $('gameEditor').innerHTML=`<div class="card"><h2>${index<0?'Add a game':'Edit a game'}</h2><label>Week</label><input id="gdWeek" type="number" min="1" step="1" value="${esc(g.week)}"><label>First team</label><input id="gdAway" value="${esc(g.away)}"><label>Second team</label><input id="gdHome" value="${esc(g.home)}"><button id="gdTeams" class="secondary full" style="margin-top:8px">Apply teams / refresh pick choices</button><label>Actual winner (leave blank until final)</label><select id="gdWinner">${options(g.winner)}</select><h2 class="sectionhead">Everyone's picks</h2>${data.members.map(m=>`<label>${esc(m.name)}</label><select data-gdpick="${esc(m.id)}">${options(g.picks?.[m.id])}</select>`).join('')}<button id="gdSave" class="full" style="margin-top:12px">Save weekly game</button>${index>=0?'<button id="gdDelete" class="danger full" style="margin-top:8px">Delete this game</button>':''}</div>`;
 $('gdTeams').onclick=()=>{const a=$('gdAway').value.trim(),h=$('gdHome').value.trim();if(!a||!h||a.toLowerCase()===h.toLowerCase())return toast('Enter two different teams');const winner=$('gdWinner').value;const picks=Object.fromEntries(data.members.map(m=>[m.id,document.querySelector(`[data-gdpick="${CSS.escape(m.id)}"]`).value]));g.away=a;g.home=h;g.winner=[a,h].includes(winner)?winner:'';g.picks=Object.fromEntries(Object.entries(picks).filter(([id,v])=>[a,h].includes(v)));$('gdWinner').innerHTML=options(g.winner);data.members.forEach(m=>{document.querySelector(`[data-gdpick="${CSS.escape(m.id)}"]`).innerHTML=options(g.picks[m.id])});toast('Teams applied — select picks and save')};

async function refreshYahoo(){

const CHAMPION_EVENTS=[
 {id:'mlb',icon:'⚾',name:'MLB',month:'November'},
 {id:'cfb',icon:'🏈',name:'College Football',month:'January'},
 {id:'nfl',icon:'🏈',name:'NFL',month:'February'},
 {id:'cbb',icon:'🏀',name:'College Basketball',month:'April'},
 {id:'golf',icon:'⛳',name:'Masters/PGA',month:'April'},
 {id:'nba',icon:'🏀',name:'NBA',month:'June'},
 {id:'nhl',icon:'🏒',name:'NHL',month:'June'}
];
function champName(s){return String(s||'').trim().toLowerCase()}
function champScore(v){return v!==''&&v!=null&&Number.isFinite(Number(v))?Number(v):null}
function champEventPoints(ev,r){
 const out=Object.fromEntries(data.members.map(m=>[m.id,0]));
 if(ev.id==='golf'){
  const winner=champName(r.winner),scores=r.golfScores||{};
  for(const m of data.members){
   const pick=r.golfPicks?.[m.id];if(!pick)continue;
   const selected=[pick.top1,pick.top2,pick.wildcard].map(champName);
   if(winner&&selected.includes(winner))out[m.id]+=2;
   if(winner&&champName(pick.wildcard)===winner)out[m.id]+=1;
  }
  const totals=data.members.map(m=>{
   const pick=r.golfPicks?.[m.id];
   if(!pick||![pick.top1,pick.top2,pick.wildcard].every(Boolean))return null;
   const nums=[pick.top1,pick.top2,pick.wildcard].map(n=>champScore(scores[champName(n)]));
   return nums.every(n=>n!==null)?{id:m.id,total:nums.reduce((a,b)=>a+b,0)}:null;
  }).filter(Boolean);
  // Only award combined-score bonus after every entered three-golfer lineup has a recorded score.
  const complete=data.members.filter(m=>{const p=r.golfPicks?.[m.id];return p&&[p.top1,p.top2,p.wildcard].every(Boolean)}).length;
  if(complete&&totals.length===complete&&r.golfScoresFinal){
   const best=Math.min(...totals.map(t=>t.total));
   totals.filter(t=>t.total===best).forEach(t=>out[t.id]++);
  }
 }else{
  const winner=champName(r.winner);
  const eligible=[];
  for(const m of data.members){
   const pick=r.picks?.[m.id],team=typeof pick==='string'?pick:pick?.team;
   if(!winner||champName(team)!==winner)continue;
   out[m.id]=2;
   const predicted=typeof pick==='object'?pick?.score:null;
   const actual=r.actualScore;
   if(predicted&&actual&&[predicted.a,predicted.b,actual.a,actual.b].every(v=>champScore(v)!==null)){
    const error=Math.abs(Number(predicted.a)-Number(actual.a))+Math.abs(Number(predicted.b)-Number(actual.b));
    eligible.push({id:m.id,error});
   }
  }
  if(eligible.length){
   const best=Math.min(...eligible.map(x=>x.error));
   eligible.filter(x=>x.error===best).forEach(x=>out[x.id]++);
  }
 }
 return out;
}

function gameEditor(e,index){const games=e.gameday?.games||[];const g=index<0?{week:games.length?Math.max(...games.map(x=>Number(x.week)||0))+1:1,home:'',away:'',winner:'',picks:{}}:games[index];const options=(v)=>`<option value="">No selection</option>${[g.away,g.home].filter(Boolean).map(t=>`<option value="${esc(t)}" ${v===t?'selected':''}>${esc(t)}</option>`).join('')}`;
 $('gameEditor').innerHTML=`<div class="card"><h2>${index<0?'Add a game':'Edit a game'}</h2><label>Week</label><input id="gdWeek" type="number" min="1" step="1" value="${esc(g.week)}"><label>First team</label><input id="gdAway" value="${esc(g.away)}"><label>Second team</label><input id="gdHome" value="${esc(g.home)}"><button id="gdTeams" class="secondary full" style="margin-top:8px">Apply teams / refresh pick choices</button><label>Actual winner (leave blank until final)</label><select id="gdWinner">${options(g.winner)}</select><h2 class="sectionhead">Everyone's picks</h2>${data.members.map(m=>`<label>${esc(m.name)}</label><select data-gdpick="${esc(m.id)}">${options(g.picks?.[m.id])}</select>`).join('')}<button id="gdSave" class="full" style="margin-top:12px">Save weekly game</button>${index>=0?'<button id="gdDelete" class="danger full" style="margin-top:8px">Delete this game</button>':''}</div>`;
 $('gdTeams').onclick=()=>{const a=$('gdAway').value.trim(),h=$('gdHome').value.trim();if(!a||!h||a.toLowerCase()===h.toLowerCase())return toast('Enter two different teams');const winner=$('gdWinner').value;const picks=Object.fromEntries(data.members.map(m=>[m.id,document.querySelector(`[data-gdpick="${CSS.escape(m.id)}"]`).value]));g.away=a;g.home=h;g.winner=[a,h].includes(winner)?winner:'';g.picks=Object.fromEntries(Object.entries(picks).filter(([id,v])=>[a,h].includes(v)));$('gdWinner').innerHTML=options(g.winner);data.members.forEach(m=>{document.querySelector(`[data-gdpick="${CSS.escape(m.id)}"]`).innerHTML=options(g.picks[m.id])});toast('Teams applied — select picks and save')};
 $('gdSave').onclick=()=>{const week=Number($('gdWeek').value),a=$('gdAway').value.trim(),h=$('gdHome').value.trim();if(!Number.isInteger(week)||week<1||!a||!h||a.toLowerCase()===h.toLowerCase())return toast('Enter valid week and two teams');if(games.some((x,i)=>i!==index&&Number(x.week)===week))return toast('That week already exists');if(a!==g.away||h!==g.home)return toast('Tap Apply teams first');const winner=$('gdWinner').value,picks={};for(const m of data.members){const v=document.querySelector(`[data-gdpick="${CSS.escape(m.id)}"]`).value;if(v)picks[m.id]=v}const next={week,away:a,home:h,winner,picks};if(!e.gameday)e.gameday={games:[]};if(index<0)e.gameday.games.push(next);else e.gameday.games[index]=next;e.gameday.games.sort((a,b)=>a.week-b.week);e.status='Live';save()};
 if(index>=0)$('gdDelete').onclick=()=>{if(confirm('Delete this week and all picks for it?')){e.gameday.games.splice(index,1);save()}};
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.eventTab){tab='events';chosen=b.dataset.eventTab}else{tab=b.dataset.tab;chosen=null}render();window.scrollTo(0,0);b.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'})});if(!new URLSearchParams(location.search).has('gd_token')){render();if(cloud){(async()=>{await restoreSession();await loadCloud();render();await window.gdRefreshPrivate?.()})();setInterval(()=>{if(!editing)loadCloud()},30000)}}
</script><script src="gameday-private.js?v=17"></script><script src="gameday-scoring.js?v=1"></script><script src="gameday-multipick.js?v=3"></script></body></html>
